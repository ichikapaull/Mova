# Native modules that are allowed to run their install scripts.
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild

# Mova serves its own thumbnails and never uses next/image, so the large
# sharp/libvips optional dependency of Next.js is skipped.
ignoredOptionalDependencies:
  - sharp

# Only fetch native binaries for glibc Linux (skips musl builds of SWC etc.).
# Adjust if you run Mova on another OS/libc.
supportedArchitectures:
  os: [current]
  cpu: [current]
  libc: [glibc]
